<mat-expansion-panel [expanded]="false" data-cy="eurogeographics-basemap-expansion-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>Basemaps provided by EuroGeographics</mat-panel-title>
  </mat-expansion-panel-header>

  <mat-accordion class="euro-options" cdkDropList [cdkDropListData]="options"
    (cdkDropListDropped)="dropEuroGeographicsOptions($event)">
    <div class="option-item-wrapper" *ngFor="let option of options" cdkDrag cdkDragLockAxis="y">
      <mat-expansion-panel class="option-item" [expanded]="false">
        <mat-expansion-panel-header>
          <mat-panel-title>
            <span class="option-checkbox-header" (click)="$event.stopPropagation()">
              <span class="drag-handle" cdkDragHandle (click)="$event.stopPropagation()" aria-label="Drag to reorder"
                title="Drag to reorder">
                <span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span>
              </span>
              <mat-checkbox class="option-toggle" [checked]="isSelected(option)" [disabled]="!isCrsSupported(option)"
                (change)="updateSelection($event, option)">
              </mat-checkbox>
              <span class="option-name">{{ option.name }}</span>
            </span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="option-body" [class.option-disabled]="!isCrsSupported(option)">
          <div class="option-slider-box">
            <span class="slider-label">Transparency</span>
            <mat-slider [value]="getOpacity(option)" [min]="0" [max]="1" [step]="0.01"
              [disabled]="!isCrsSupported(option)" (input)="updateOpacity($event, option)">
            </mat-slider>
          </div>

          <div class="provider-line">
            <a class="provider-link" href="https://eurogeographics.org/" target="_blank" rel="noopener noreferrer"
              (click)="$event.stopPropagation()">
              <img class="provider-logo" src="assets/img/EURO-Final-Logo-CMYK.png" alt="EuroGeographics logo">
            </a>
          </div>

          <div class="preview-wrapper" *ngIf="option.thumbnailSource">
            <img [src]="option.thumbnailSource" [alt]="option.name + ' preview'">
            <a class="layer-link-btn" [href]="option.datasetUrl" target="_blank" rel="noopener noreferrer"
              (click)="$event.stopPropagation()">
              More Details
            </a>
          </div>
        </div>
        <div class="footer-eurbmap">
          <p>© EuroGeographics 2026</p>
        </div>
      </mat-expansion-panel>
    </div>
  </mat-accordion>
</mat-expansion-panel>
